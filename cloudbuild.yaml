# Cloud Build configuration for QiA Orchestrator

steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/qia-orchestrator'
      - './orchestrator'
  
  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/qia-orchestrator'
  
  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'qia-orchestrator'
      - '--image'
      - 'gcr.io/$PROJECT_ID/qia-orchestrator'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'PROJECT_ID=$PROJECT_ID,VERTEX_AI_LOCATION=us-central1,GEMINI_MODEL=gemini-2.5-pro'
      - '--no-cpu-throttling'

# Store images
images:
  - 'gcr.io/$PROJECT_ID/qia-orchestrator'

# Build options
options:
  machineType: 'N1_HIGHCPU_8'

# Timeout
timeout: '600s'
