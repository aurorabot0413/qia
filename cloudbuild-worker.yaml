# Cloud Build configuration for QA Worker

steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/qia-worker'
      - './worker'
  
  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/qia-worker'

# Store images
images:
  - 'gcr.io/$PROJECT_ID/qia-worker'

# Build options
options:
  machineType: 'N1_HIGHCPU_8'

# Timeout (Playwright necesita tiempo)
timeout: '900s'
